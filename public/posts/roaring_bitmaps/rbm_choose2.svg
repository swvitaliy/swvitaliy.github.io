<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6771"/>
    </marker>
  </defs>
  <rect width="900" height="610" fill="#fdfdfb"/>

  <text x="36" y="34" font-size="15" font-weight="600" fill="#16202a">runOptimize(): для каждого контейнера — посчитать серии, сравнить память, заменить, если run меньше</text>

  <!-- ── шаги ─────────────────────────────────────────────── -->
  <rect x="36" y="56" width="260" height="112" rx="5" fill="#ffffff" stroke="#dfe2de"/>
  <text x="52" y="80" font-size="13" font-weight="600" fill="#16202a">1. Посчитать число серий R</text>
  <text x="52" y="102" font-size="11.5" fill="#3f7d58">array:</text>
  <text x="96" y="102" font-size="11.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#16202a">R = 1 + #{a[i+1] − a[i] &gt; 1}</text>
  <text x="52" y="122" font-size="11.5" fill="#2b4c7e">bitmap:</text>
  <text x="104" y="122" font-size="11.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#16202a">R = Σ popcnt(w &amp; ~(w « 1))</text>
  <text x="52" y="140" font-size="11" fill="#5b6771">т.е. число фронтов 0→1 по словам</text>
  <text x="52" y="157" font-size="11" fill="#5b6771">с ранним выходом, как только run уже не выгоден</text>

  <path d="M296,112 L318,112" stroke="#5b6771" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="320" y="56" width="260" height="112" rx="5" fill="#ffffff" stroke="#dfe2de"/>
  <text x="336" y="80" font-size="13" font-weight="600" fill="#16202a">2. Сравнить размеры в байтах</text>
  <text x="336" y="104" font-size="11.5" fill="#7a5aa6">run:</text>
  <text x="376" y="104" font-size="11.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#16202a">4 · R + 2</text>
  <text x="336" y="126" font-size="11.5" fill="#3f7d58">array:</text>
  <text x="376" y="126" font-size="11.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#16202a">2 · N</text>
  <text x="336" y="148" font-size="11.5" fill="#2b4c7e">bitmap:</text>
  <text x="386" y="148" font-size="11.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#16202a">8192</text>
  <text x="450" y="126" font-size="11" fill="#5b6771">2 байта — счётчик серий,</text>
  <text x="450" y="142" font-size="11" fill="#5b6771">4 байта — пара (start, len−1)</text>

  <path d="M580,112 L602,112" stroke="#5b6771" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="604" y="56" width="260" height="112" rx="5" fill="#ffffff" stroke="#dfe2de"/>
  <text x="620" y="80" font-size="13" font-weight="600" fill="#16202a">3. Решение</text>
  <text x="620" y="106" font-size="11.5" fill="#16202a">run меньше → заменить контейнер</text>
  <text x="620" y="124" font-size="11.5" fill="#16202a">иначе → не трогать</text>
  <text x="620" y="150" font-size="11" fill="#5b6771">Хуже не делает; обратный ход —</text>
  <text x="620" y="164" font-size="11" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#5b6771">removeRunCompression()</text>

  <!-- ── примеры ─────────────────────────────────────────── -->
  <text x="36" y="204" font-size="12.5" font-weight="600" fill="#16202a">Три случая на конкретных данных одного чанка</text>

  <!-- строка A: array → run -->
  <text x="36" y="240" font-size="13" font-weight="600" fill="#3f7d58">array</text>
  <text x="36" y="258" font-size="11.5" fill="#5b6771">N = 487</text>
  <text x="36" y="276" font-size="11.5" fill="#5b6771">R = 3</text>

  <g fill="#3f7d58" fill-opacity="0.14" stroke="#3f7d58" stroke-opacity="0.45">
    <rect x="160" y="226" width="24" height="22" rx="2"/><rect x="186" y="226" width="24" height="22" rx="2"/><rect x="212" y="226" width="24" height="22" rx="2"/><rect x="238" y="226" width="24" height="22" rx="2"/>
    <rect x="278" y="226" width="24" height="22" rx="2"/><rect x="304" y="226" width="24" height="22" rx="2"/>
    <rect x="344" y="226" width="24" height="22" rx="2"/><rect x="370" y="226" width="24" height="22" rx="2"/><rect x="396" y="226" width="30" height="22" rx="2"/>
  </g>
  <g font-size="11" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#16202a" text-anchor="middle">
    <text x="172" y="241">3</text><text x="198" y="241">4</text><text x="224" y="241">5</text><text x="250" y="241">6</text>
    <text x="290" y="241">10</text><text x="316" y="241">11</text>
    <text x="356" y="241">20</text><text x="382" y="241">…</text><text x="411" y="241">500</text>
  </g>
  <g stroke="#7a5aa6" stroke-width="1.2" fill="none">
    <path d="M160,256 v6 h102 v-6"/><path d="M278,256 v6 h50 v-6"/><path d="M344,256 v6 h82 v-6"/>
  </g>
  <g font-size="10.5" fill="#7a5aa6" text-anchor="middle">
    <text x="211" y="276">start 3, len 4</text><text x="303" y="276">start 10, len 2</text><text x="385" y="276">start 20, len 481</text>
  </g>
  <text x="160" y="305" font-size="11.5" fill="#7a5aa6" font-weight="600">run:</text>
  <g fill="#7a5aa6" fill-opacity="0.22" stroke="#7a5aa6" stroke-opacity="0.5">
    <rect x="194" y="290" width="62" height="22" rx="2"/><rect x="262" y="290" width="62" height="22" rx="2"/><rect x="330" y="290" width="72" height="22" rx="2"/>
  </g>
  <g font-size="11" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#16202a" text-anchor="middle">
    <text x="225" y="305">3, 3</text><text x="293" y="305">10, 1</text><text x="366" y="305">20, 480</text>
  </g>
  <text x="414" y="305" font-size="10.5" fill="#5b6771">хранится len − 1</text>

  <g font-size="11.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#16202a">
    <text x="660" y="241">array: 2·487   = 974 байт</text>
    <text x="660" y="261">run:   4·3 + 2 =  14 байт</text>
  </g>
  <text x="660" y="300" font-size="12.5" font-weight="600" fill="#3f7d58">14 &lt; 974 → конвертируем</text>

  <line x1="36" y1="330" x2="864" y2="330" stroke="#e6e8e4"/>

  <!-- строка B: array остаётся -->
  <text x="36" y="366" font-size="13" font-weight="600" fill="#3f7d58">array</text>
  <text x="36" y="384" font-size="11.5" fill="#5b6771">N = 6</text>
  <text x="36" y="402" font-size="11.5" fill="#5b6771">R = 6</text>

  <g fill="#3f7d58" fill-opacity="0.14" stroke="#3f7d58" stroke-opacity="0.45">
    <rect x="160" y="352" width="24" height="22" rx="2"/><rect x="200" y="352" width="24" height="22" rx="2"/><rect x="240" y="352" width="24" height="22" rx="2"/><rect x="280" y="352" width="24" height="22" rx="2"/><rect x="320" y="352" width="24" height="22" rx="2"/><rect x="360" y="352" width="24" height="22" rx="2"/>
  </g>
  <g font-size="11" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#16202a" text-anchor="middle">
    <text x="172" y="367">1</text><text x="212" y="367">3</text><text x="252" y="367">5</text><text x="292" y="367">7</text><text x="332" y="367">9</text><text x="372" y="367">11</text>
  </g>
  <g stroke="#7a5aa6" stroke-width="1.2" fill="none">
    <path d="M160,382 v6 h24 v-6"/><path d="M200,382 v6 h24 v-6"/><path d="M240,382 v6 h24 v-6"/><path d="M280,382 v6 h24 v-6"/><path d="M320,382 v6 h24 v-6"/><path d="M360,382 v6 h24 v-6"/>
  </g>
  <text x="160" y="408" font-size="10.5" fill="#7a5aa6">между всеми соседями разрыв — каждый элемент сам себе серия</text>
  <text x="160" y="432" font-size="11" fill="#5b6771">подсчёт обрывается раньше конца: уже при R = 3 стало 4·3+2 = 14 ≥ 12</text>

  <g font-size="11.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#16202a">
    <text x="660" y="367">array: 2·6     = 12 байт</text>
    <text x="660" y="387">run:   4·6 + 2 = 26 байт</text>
  </g>
  <text x="660" y="426" font-size="12.5" font-weight="600" fill="#5b6771">26 ≥ 12 → оставляем array</text>

  <line x1="36" y1="456" x2="864" y2="456" stroke="#e6e8e4"/>

  <!-- строка C: bitmap → run -->
  <text x="36" y="492" font-size="13" font-weight="600" fill="#2b4c7e">bitmap</text>
  <text x="36" y="510" font-size="11.5" fill="#5b6771">N ≈ 60 000</text>
  <text x="36" y="528" font-size="11.5" fill="#5b6771">R = 2</text>

  <rect x="160" y="480" width="480" height="22" rx="2" fill="none" stroke="#c8ccc8"/>
  <rect x="160" y="480" width="293" height="22" rx="2" fill="#2b4c7e" fill-opacity="0.32"/>
  <rect x="490" y="480" width="146" height="22" rx="2" fill="#2b4c7e" fill-opacity="0.32"/>
  <g font-size="10" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#5b6771" text-anchor="middle">
    <text x="160" y="518">0</text><text x="453" y="518">40000</text><text x="490" y="534">45000</text><text x="636" y="518">65000</text>
  </g>
  <g stroke="#7a5aa6" stroke-width="1.2" fill="none">
    <path d="M160,542 v6 h293 v-6"/><path d="M490,542 v6 h146 v-6"/>
  </g>
  <g font-size="10.5" fill="#7a5aa6" text-anchor="middle">
    <text x="306" y="562">start 0, len 40000</text><text x="563" y="562">start 45000, len 20000</text>
  </g>
  <text x="160" y="584" font-size="11" fill="#5b6771">popcnt(w &amp; ~(w « 1)) даёт ненулевой вклад только в двух словах из 1024</text>

  <g font-size="11.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#16202a">
    <text x="660" y="493">bitmap:        8192 байт</text>
    <text x="660" y="513">run:   4·2 + 2 =  10 байт</text>
  </g>
  <text x="660" y="552" font-size="12.5" font-weight="600" fill="#3f7d58">10 &lt; 8192 → конвертируем</text>
</svg>
