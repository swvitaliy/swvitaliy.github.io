<svg xmlns="http://www.w3.org/2000/svg" width="680" height="390" viewBox="0 0 680 390" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Диаграмма переходов container.normalize()</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t  { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; fill: #5F5E5A; }
      .arr { stroke: #5F5E5A; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <rect width="680" height="390" fill="#FFFFFF"/>

  <rect x="260" y="30" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text class="t" x="340" y="57" text-anchor="middle" fill="#085041">kindRun</text>

  <rect x="60" y="220" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text class="t" x="140" y="247" text-anchor="middle" fill="#085041">kindArray</text>

  <rect x="460" y="220" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text class="t" x="540" y="247" text-anchor="middle" fill="#085041">kindBitmap</text>

  <path d="M420 42 C470 26, 470 80, 423 66" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="474" y="56">иначе остаётся</text>

  <line x1="270" y1="74" x2="181" y2="216" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="210" y="138" text-anchor="end">run крупнее,</text>
  <text class="ts" x="210" y="154" text-anchor="end">card ≤ arrayMax</text>

  <line x1="410" y1="74" x2="499" y2="216" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="470" y="138">run крупнее,</text>
  <text class="ts" x="470" y="154">card &gt; arrayMax</text>

  <line x1="222" y1="234" x2="456" y2="234" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="340" y="224" text-anchor="middle">card &gt; arrayMax</text>

  <line x1="458" y1="252" x2="224" y2="252" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="340" y="272" text-anchor="middle">card ≤ arrayMax</text>

  <path d="M110 264 C110 310, 170 310, 170 268" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="140" y="326" text-anchor="middle">card ≤ arrayMax</text>

  <path d="M510 264 C510 310, 570 310, 570 268" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="540" y="326" text-anchor="middle">card &gt; arrayMax</text>

  <text class="ts" x="340" y="366" text-anchor="middle">run крупнее: runsBytes(len(runs)) &gt; min(2·card, bitmapBytes)</text>
</svg>
