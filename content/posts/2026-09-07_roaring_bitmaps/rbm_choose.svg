<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6771"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3346a"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#fdfdfb"/>

  <!-- ── уровень 0: само значение ───────────────────────────── -->
  <text x="36" y="34" font-size="15" font-weight="600" fill="#16202a">32-битное значение 240589 = 0x0003ABCD</text>

  <text x="243" y="60" font-size="11.5" fill="#5b6771" text-anchor="middle">биты 31…16</text>
  <text x="657" y="60" font-size="11.5" fill="#5b6771" text-anchor="middle">биты 15…0</text>

  <rect x="36" y="68" width="414" height="44" rx="3" fill="#2b4c7e" fill-opacity="0.12" stroke="#2b4c7e" stroke-opacity="0.5"/>
  <rect x="450" y="68" width="414" height="44" rx="3" fill="#a3346a" fill-opacity="0.12" stroke="#a3346a" stroke-opacity="0.5"/>
  <text x="243" y="96" font-size="14" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#16202a" text-anchor="middle">0000 0000 0000 0011</text>
  <text x="657" y="96" font-size="14" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#16202a" text-anchor="middle">1010 1011 1100 1101</text>

  <text x="243" y="132" font-size="12.5" fill="#2b4c7e" text-anchor="middle">ключ контейнера 0x0003</text>
  <text x="657" y="132" font-size="12.5" fill="#a3346a" text-anchor="middle">смещение внутри чанка 0xABCD = 43981</text>

  <!-- ── уровень 1: массив ключей ───────────────────────────── -->
  <text x="36" y="176" font-size="12.5" font-weight="600" fill="#16202a">Первый уровень: отсортированный массив ключей, бинарный поиск</text>
  <path d="M243,138 C243,162 188,164 188,184" fill="none" stroke="#5b6771" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="36" y="190" width="96" height="34" rx="3" fill="none" stroke="#c8ccc8"/>
  <text x="84" y="212" font-size="12.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#5b6771" text-anchor="middle">0x0000</text>
  <rect x="140" y="190" width="96" height="34" rx="3" fill="#2b4c7e" fill-opacity="0.14" stroke="#2b4c7e"/>
  <text x="188" y="212" font-size="12.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#16202a" font-weight="600" text-anchor="middle">0x0003</text>
  <rect x="244" y="190" width="96" height="34" rx="3" fill="none" stroke="#c8ccc8"/>
  <text x="292" y="212" font-size="12.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#5b6771" text-anchor="middle">0x0007</text>
  <text x="356" y="212" font-size="13" fill="#98a0a6">…</text>

  <!-- связи ключ → контейнер -->
  <path d="M84,224 C84,244 168,246 168,266" fill="none" stroke="#c8ccc8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M188,224 C188,244 450,244 450,266" fill="none" stroke="#2b4c7e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M292,224 C292,244 732,244 732,266" fill="none" stroke="#c8ccc8" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- смещение → конкретный бит -->
  <path d="M657,140 C640,240 540,320 476,394" fill="none" stroke="#a3346a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowPink)"/>

  <text x="36" y="256" font-size="12.5" font-weight="600" fill="#16202a">Второй уровень: контейнер на каждый чанк 2^16 — тип выбирается по объёму памяти</text>

  <!-- ── контейнер A: array ─────────────────────────────────── -->
  <rect x="36" y="270" width="264" height="210" rx="5" fill="#ffffff" stroke="#dfe2de"/>
  <text x="54" y="294" font-size="11.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#98a0a6">чанк 0x0000</text>
  <text x="54" y="318" font-size="15" font-weight="600" fill="#3f7d58">array</text>
  <text x="54" y="339" font-size="12" fill="#16202a">N ≤ 4096 значений</text>
  <text x="54" y="357" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#5b6771">2 · N байт</text>
  <g fill="#3f7d58" fill-opacity="0.14" stroke="#3f7d58" stroke-opacity="0.45">
    <rect x="54" y="374" width="52" height="28" rx="2"/>
    <rect x="110" y="374" width="52" height="28" rx="2"/>
    <rect x="166" y="374" width="52" height="28" rx="2"/>
    <rect x="222" y="374" width="52" height="28" rx="2"/>
  </g>
  <g font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#16202a" text-anchor="middle">
    <text x="80" y="393">12</text>
    <text x="136" y="393">57</text>
    <text x="192" y="393">903</text>
    <text x="248" y="393">…</text>
  </g>
  <text x="54" y="432" font-size="12" fill="#5b6771">отсортированный uint16[]</text>
  <text x="54" y="452" font-size="12" fill="#5b6771">поиск — бинарный</text>

  <!-- ── контейнер B: bitmap ────────────────────────────────── -->
  <rect x="318" y="270" width="264" height="210" rx="5" fill="#ffffff" stroke="#2b4c7e" stroke-opacity="0.55"/>
  <text x="336" y="294" font-size="11.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#98a0a6">чанк 0x0003</text>
  <text x="336" y="318" font-size="15" font-weight="600" fill="#2b4c7e">bitmap</text>
  <text x="336" y="339" font-size="12" fill="#16202a">N &gt; 4096 значений</text>
  <text x="336" y="357" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#5b6771">8192 байта всегда</text>

  <g stroke="#c8ccc8" stroke-width="0.8">
    <g fill="#2b4c7e" fill-opacity="0.32">
      <rect x="346" y="374" width="10" height="10"/><rect x="372" y="374" width="10" height="10"/><rect x="411" y="374" width="10" height="10"/><rect x="476" y="374" width="10" height="10"/><rect x="515" y="374" width="10" height="10"/>
      <rect x="359" y="387" width="10" height="10"/><rect x="398" y="387" width="10" height="10"/><rect x="437" y="387" width="10" height="10"/><rect x="528" y="387" width="10" height="10"/>
      <rect x="346" y="400" width="10" height="10"/><rect x="385" y="400" width="10" height="10"/><rect x="489" y="400" width="10" height="10"/><rect x="541" y="400" width="10" height="10"/>
      <rect x="372" y="413" width="10" height="10"/><rect x="424" y="413" width="10" height="10"/><rect x="502" y="413" width="10" height="10"/><rect x="541" y="413" width="10" height="10"/>
    </g>
    <g fill="none">
      <rect x="346" y="374" width="10" height="10"/><rect x="359" y="374" width="10" height="10"/><rect x="372" y="374" width="10" height="10"/><rect x="385" y="374" width="10" height="10"/><rect x="398" y="374" width="10" height="10"/><rect x="411" y="374" width="10" height="10"/><rect x="424" y="374" width="10" height="10"/><rect x="437" y="374" width="10" height="10"/><rect x="450" y="374" width="10" height="10"/><rect x="463" y="374" width="10" height="10"/><rect x="476" y="374" width="10" height="10"/><rect x="489" y="374" width="10" height="10"/><rect x="502" y="374" width="10" height="10"/><rect x="515" y="374" width="10" height="10"/><rect x="528" y="374" width="10" height="10"/><rect x="541" y="374" width="10" height="10"/>
      <rect x="346" y="387" width="10" height="10"/><rect x="359" y="387" width="10" height="10"/><rect x="372" y="387" width="10" height="10"/><rect x="385" y="387" width="10" height="10"/><rect x="398" y="387" width="10" height="10"/><rect x="411" y="387" width="10" height="10"/><rect x="424" y="387" width="10" height="10"/><rect x="437" y="387" width="10" height="10"/><rect x="450" y="387" width="10" height="10"/><rect x="463" y="387" width="10" height="10"/><rect x="476" y="387" width="10" height="10"/><rect x="489" y="387" width="10" height="10"/><rect x="502" y="387" width="10" height="10"/><rect x="515" y="387" width="10" height="10"/><rect x="528" y="387" width="10" height="10"/><rect x="541" y="387" width="10" height="10"/>
      <rect x="346" y="400" width="10" height="10"/><rect x="359" y="400" width="10" height="10"/><rect x="372" y="400" width="10" height="10"/><rect x="385" y="400" width="10" height="10"/><rect x="398" y="400" width="10" height="10"/><rect x="411" y="400" width="10" height="10"/><rect x="424" y="400" width="10" height="10"/><rect x="437" y="400" width="10" height="10"/><rect x="450" y="400" width="10" height="10"/><rect x="476" y="400" width="10" height="10"/><rect x="489" y="400" width="10" height="10"/><rect x="502" y="400" width="10" height="10"/><rect x="515" y="400" width="10" height="10"/><rect x="528" y="400" width="10" height="10"/><rect x="541" y="400" width="10" height="10"/>
      <rect x="346" y="413" width="10" height="10"/><rect x="359" y="413" width="10" height="10"/><rect x="372" y="413" width="10" height="10"/><rect x="385" y="413" width="10" height="10"/><rect x="398" y="413" width="10" height="10"/><rect x="411" y="413" width="10" height="10"/><rect x="424" y="413" width="10" height="10"/><rect x="437" y="413" width="10" height="10"/><rect x="450" y="413" width="10" height="10"/><rect x="463" y="413" width="10" height="10"/><rect x="476" y="413" width="10" height="10"/><rect x="489" y="413" width="10" height="10"/><rect x="502" y="413" width="10" height="10"/><rect x="515" y="413" width="10" height="10"/><rect x="528" y="413" width="10" height="10"/><rect x="541" y="413" width="10" height="10"/>
    </g>
  </g>
  <rect x="463" y="400" width="10" height="10" fill="#a3346a" stroke="#a3346a"/>

  <text x="336" y="446" font-size="12" fill="#a3346a">бит №43981 выставлен</text>
  <text x="336" y="464" font-size="12" fill="#5b6771">проверка за O(1) по смещению</text>

  <!-- ── контейнер C: run ───────────────────────────────────── -->
  <rect x="600" y="270" width="264" height="210" rx="5" fill="#ffffff" stroke="#dfe2de"/>
  <text x="618" y="294" font-size="11.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#98a0a6">чанк 0x0007</text>
  <text x="618" y="318" font-size="15" font-weight="600" fill="#7a5aa6">run</text>
  <text x="618" y="339" font-size="12" fill="#16202a">R серий, R ≤ 2047 и R &lt; N / 2</text>
  <text x="618" y="357" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#5b6771">4 · R + 2 байта</text>
  <g fill="#7a5aa6" fill-opacity="0.25" stroke="#7a5aa6" stroke-opacity="0.5">
    <rect x="618" y="376" width="88" height="20" rx="2"/>
    <rect x="716" y="376" width="38" height="20" rx="2"/>
    <rect x="764" y="376" width="76" height="20" rx="2"/>
  </g>
  <text x="618" y="414" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#5b6771">(start, length) × R</text>
  <text x="618" y="446" font-size="12" fill="#5b6771">не возникает сам при вставке —</text>
  <text x="618" y="464" font-size="12" fill="#5b6771">только через runOptimize()</text>

  <!-- ── подпись ────────────────────────────────────────────── -->
  <line x1="36" y1="508" x2="864" y2="508" stroke="#e6e8e4"/>
  <text x="36" y="532" font-size="12" fill="#5b6771">Порог 4096 — точка безубыточности: 4096 × 2 байта = 8192 байта, ровно размер битмапа. Выше порога массив только растёт, битмап — нет.</text>
</svg>
